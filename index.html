<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>明日の天気は？</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Noto+Serif+JP:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#f4f6fb;
    --ink-soft:rgba(244,246,251,.72);
    --ink-faint:rgba(244,246,251,.32);
    --bg:#080a10;
    --warm:#d9b88a;
    --gold:#ffd89a;
    --serif:'Noto Serif JP', serif;
    --latin:'Cormorant Garamond', serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{
    width:100%;height:100%;overflow:hidden;
    background:var(--bg);color:var(--ink);
    font-family:var(--serif);font-weight:300;
    -webkit-font-smoothing:antialiased;
  }

  /* ============ atmospheric background ============ */
  .bg-fallback{
    position:fixed;inset:0;z-index:0;
    background:
      radial-gradient(ellipse at 30% 25%, rgba(80,100,140,.18), transparent 60%),
      radial-gradient(ellipse at 75% 80%, rgba(40,55,80,.22), transparent 65%),
      linear-gradient(180deg, #0c1220 0%, #050810 50%, #02040a 100%);
    transition:background 5s cubic-bezier(.4,0,.2,1);
  }
  /* sunny — bright 天気の子 sunset breakthrough */
  body.sunny .bg-fallback{
    background:
      radial-gradient(ellipse at 50% 62%, rgba(255,210,130,.55), transparent 50%),
      radial-gradient(ellipse at 50% 55%, rgba(255,180,90,.4), transparent 70%),
      linear-gradient(180deg,
        #1a3a6a 0%,
        #4a72a8 18%,
        #b88f6c 50%,
        #e8b88a 75%,
        #ffd098 100%);
  }
  /* rainy — deeper darker sky */
  body.rainy .bg-fallback{
    background:
      radial-gradient(ellipse at 50% 45%, rgba(40,55,85,.35), transparent 70%),
      linear-gradient(180deg, #050810 0%, #02040a 50%, #000003 100%);
  }

  /* sun (only visible when body.sunny) */
  .sun{
    position:fixed;left:50%;top:54%;transform:translate(-50%,-50%) scale(.7);z-index:2;
    width:min(72vmin, 480px);height:min(72vmin, 480px);
    border-radius:50%;
    background:radial-gradient(circle,
      rgba(255,250,220,.92) 0%,
      rgba(255,225,150,.85) 22%,
      rgba(255,195,105,.55) 45%,
      rgba(255,170,80,.22) 70%,
      transparent 100%);
    opacity:0;
    transition:opacity 5s ease, transform 5s cubic-bezier(.2,.6,.2,1);
    pointer-events:none;
    filter:blur(1px);
  }
  body.sunny .sun{
    opacity:1;
    transform:translate(-50%,-50%) scale(1.1);
  }
  /* slow rotating rays — only visible on sunny */
  .sun-rays{
    position:fixed;left:50%;top:54%;transform:translate(-50%,-50%) rotate(0deg);
    z-index:1;pointer-events:none;
    width:min(180vmin, 1400px);height:min(180vmin, 1400px);
    background:conic-gradient(
      from 0deg,
      transparent 0deg,    rgba(255,200,110,.06) 4deg,  transparent 8deg,
      transparent 30deg,   rgba(255,200,110,.05) 34deg, transparent 38deg,
      transparent 60deg,   rgba(255,200,110,.06) 64deg, transparent 68deg,
      transparent 90deg,   rgba(255,200,110,.04) 94deg, transparent 98deg,
      transparent 120deg,  rgba(255,200,110,.06) 124deg,transparent 128deg,
      transparent 150deg,  rgba(255,200,110,.05) 154deg,transparent 158deg,
      transparent 180deg,  rgba(255,200,110,.06) 184deg,transparent 188deg,
      transparent 210deg,  rgba(255,200,110,.05) 214deg,transparent 218deg,
      transparent 240deg,  rgba(255,200,110,.06) 244deg,transparent 248deg,
      transparent 270deg,  rgba(255,200,110,.04) 274deg,transparent 278deg,
      transparent 300deg,  rgba(255,200,110,.06) 304deg,transparent 308deg,
      transparent 330deg,  rgba(255,200,110,.05) 334deg,transparent 338deg,
      transparent 360deg);
    border-radius:50%;
    opacity:0;
    transition:opacity 5s ease;
    animation:rayRotate 80s linear infinite;
  }
  @keyframes rayRotate{to{transform:translate(-50%,-50%) rotate(360deg)}}
  body.sunny .sun-rays{opacity:1}

  /* rain canvas */
  #rainCanvas{
    position:fixed;inset:0;z-index:3;pointer-events:none;
    transition:opacity 5s ease;
  }
  body.sunny #rainCanvas{opacity:0}

  /* lightning — occasional flash on rainy state */
  .lightning{
    position:fixed;inset:0;z-index:6;pointer-events:none;
    background:transparent;
  }
  body.rainy .lightning{
    animation:flash 11s 3s ease-in-out infinite;
  }
  @keyframes flash{
    0%, 49%, 51%, 100% {background:transparent}
    49.5% {background:rgba(200,215,255,.18)}
    50%   {background:transparent}
    50.3% {background:rgba(200,215,255,.28)}
    50.6% {background:transparent}
  }

  .grain{
    position:fixed;inset:0;z-index:5;pointer-events:none;
    opacity:.045;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 80'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='80' height='80' filter='url(%23n)'/></svg>");
  }
  .vignette{
    position:fixed;inset:0;z-index:4;pointer-events:none;
    background:radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,.42) 95%);
    transition:background 4s ease;
  }
  body.sunny .vignette{
    background:radial-gradient(ellipse at center, transparent 35%, rgba(60,30,0,.22) 95%);
  }

  /* ============ letterbox bars ============ */
  .lbar{
    position:fixed;left:0;right:0;height:48px;
    background:#000;z-index:30;pointer-events:none;
    transform:translateY(-100%);
    transition:transform 1.6s cubic-bezier(.65,0,.35,1);
  }
  .lbar.bot{top:auto;bottom:0;transform:translateY(100%)}
  body.loaded .lbar{transform:translateY(0)}

  /* ============ credit ============ */
  .credit{
    position:fixed;top:18px;left:22px;z-index:40;pointer-events:none;
    opacity:0;transition:opacity 1.6s 1.2s ease;
  }
  body.loaded .credit{opacity:1}
  .credit .c-line{
    display:flex;gap:14px;align-items:baseline;
    font-family:var(--latin);font-weight:300;font-size:9.5px;
    color:var(--ink-faint);letter-spacing:.4em;text-transform:uppercase;
    margin-bottom:3px;
  }
  .credit .c-line span:first-child{color:rgba(244,246,251,.18);min-width:46px}

  /* ============ screens (question / result) ============ */
  .screen{
    position:fixed;inset:0;z-index:10;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:80px 24px;
    opacity:0;pointer-events:none;
    transition:opacity 1.4s ease;
  }
  .screen.in{opacity:1;pointer-events:auto}

  /* ---- question screen ---- */
  .q-overline{
    font-family:var(--latin);font-weight:300;font-size:11px;letter-spacing:.6em;
    color:var(--ink-faint);text-transform:uppercase;margin-bottom:22px;
    opacity:0;transform:translateY(-6px);
    transition:opacity 1.4s .4s ease, transform 1.4s .4s ease;
  }
  .screen-q.in .q-overline{opacity:1;transform:translateY(0)}

  .q-title{
    font-weight:300;font-size:clamp(28px, 5vw, 56px);letter-spacing:.45em;
    color:var(--ink);text-shadow:0 0 30px rgba(0,0,0,.7);
    margin-bottom:14px;
    opacity:0;transform:translateY(8px);
    transition:opacity 1.6s .8s ease, transform 1.6s .8s ease;
  }
  .screen-q.in .q-title{opacity:1;transform:translateY(0)}

  .q-sub{
    font-family:var(--latin);font-weight:300;font-size:13px;letter-spacing:.5em;
    color:var(--ink-soft);text-transform:uppercase;margin-bottom:60px;
    opacity:0;
    transition:opacity 1.6s 1.4s ease;
  }
  .screen-q.in .q-sub{opacity:.7}

  .choices{
    display:flex;gap:60px;
    opacity:0;transform:translateY(12px);
    transition:opacity 1.8s 1.8s ease, transform 1.8s 1.8s ease;
  }
  .screen-q.in .choices{opacity:1;transform:translateY(0)}
  .choice{
    background:transparent;border:none;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:14px;
    padding:30px 50px;
    font-family:var(--serif);color:var(--ink);
    transition:transform .55s cubic-bezier(.2,.6,.2,1), opacity .5s ease, letter-spacing .5s ease;
  }
  .choice:hover{transform:translateY(-5px)}
  .choice:hover .choice-name{letter-spacing:.55em}
  .choice:focus{outline:none}
  .choice-name{
    font-weight:300;font-size:clamp(36px, 5vw, 60px);letter-spacing:.4em;
    text-shadow:0 0 22px rgba(0,0,0,.75);
    transition:letter-spacing .5s ease;
  }
  .choice-sub{
    font-weight:300;font-size:11px;letter-spacing:.4em;
    color:var(--ink-soft);
    text-shadow:0 0 8px rgba(0,0,0,.85);
  }
  /* color-tint sub for hint vibe */
  .choice[data-answer="sunny"] .choice-sub{color:rgba(255,180,150,.7)}
  .choice[data-answer="rainy"] .choice-sub{color:rgba(150,180,230,.7)}

  /* clicked-out animation: chosen card flares, the other dims */
  .choice.firing{
    transform:scale(.95);opacity:.55;
    transition:transform .35s ease, opacity .55s ease;
  }
  .choice.dimmed{
    opacity:.18;transform:translateY(0);
    transition:opacity .55s ease, transform .55s ease;
  }

  @media (max-width:640px){
    .choices{flex-direction:column;gap:36px}
    .choice{padding:18px 32px}
  }

  /* ---- result screen ---- */
  .r-headline{
    font-weight:400;font-size:clamp(40px, 7vw, 88px);letter-spacing:.42em;
    color:var(--ink);text-shadow:0 0 30px rgba(0,0,0,.7);
    margin-bottom:30px;text-align:center;
    opacity:0;transform:translateY(20px);
    transition:opacity 1.5s ease, transform 1.5s ease, color 2s ease, text-shadow 2s ease;
  }
  .r-headline.show{opacity:1;transform:translateY(0)}
  .r-headline.win{
    color:#fff0c8;
    text-shadow:0 0 28px rgba(255,205,120,.85), 0 0 60px rgba(255,180,80,.5), 0 0 100px rgba(255,160,60,.3);
  }
  .r-headline.lose{
    color:#b8c4dc;
    text-shadow:0 0 24px rgba(40,55,80,.85), 0 0 50px rgba(20,30,50,.6);
  }

  .r-message{
    font-weight:300;font-size:clamp(15px, 1.7vw, 19px);letter-spacing:.35em;
    color:var(--ink-soft);text-shadow:0 0 10px rgba(0,0,0,.85);
    margin-bottom:60px;text-align:center;
    opacity:0;transform:translateY(15px);
    transition:opacity 1.4s ease, transform 1.4s ease;
    max-width:90vw;
  }
  .r-message.show{opacity:1;transform:translateY(0)}

  .r-title-block{
    text-align:center;margin-top:8px;
    opacity:0;transform:translateY(15px);
    transition:opacity 1.6s ease, transform 1.6s ease;
  }
  .r-title-block.show{opacity:1;transform:translateY(0)}
  .r-title-overline{
    font-family:var(--latin);font-weight:300;font-size:11px;letter-spacing:.65em;
    color:var(--ink-faint);text-transform:uppercase;margin-bottom:18px;
  }
  .r-title-name{
    font-weight:400;font-size:clamp(22px, 3.6vw, 42px);letter-spacing:.3em;
    margin-bottom:60px;
    padding:0 20px;
  }
  .r-title-name.win{
    color:#ffd89a;
    text-shadow:0 0 24px rgba(255,200,120,.8), 0 0 50px rgba(255,180,80,.55), 0 0 90px rgba(255,160,60,.3);
    animation:titleGlow 4s ease-in-out infinite;
  }
  @keyframes titleGlow{
    0%,100%{text-shadow:0 0 24px rgba(255,200,120,.8), 0 0 50px rgba(255,180,80,.55), 0 0 90px rgba(255,160,60,.3)}
    50%   {text-shadow:0 0 30px rgba(255,210,130,.95), 0 0 64px rgba(255,190,90,.7), 0 0 110px rgba(255,170,70,.45)}
  }
  .r-title-name.lose{
    color:#c0d0e6;
    text-shadow:0 0 22px rgba(80,100,140,.7), 0 0 44px rgba(40,60,90,.45);
  }

  .retry-btn{
    background:transparent;border:1px solid var(--ink-soft);color:var(--ink);
    font-family:var(--serif);font-weight:300;font-size:13px;letter-spacing:.45em;
    padding:13px 36px;cursor:pointer;
    opacity:0;
    transition:opacity 1.2s ease, background .3s ease, border-color .3s ease, color .3s ease;
  }
  .retry-btn.show{opacity:1}
  .retry-btn:hover{background:rgba(255,255,255,.12);border-color:var(--ink)}
  .retry-btn:focus{outline:none}

  /* error / boot indicator */
  .boot-err{
    position:fixed;top:8px;left:8px;right:8px;background:#600;color:#fff;
    font:11px/1.5 monospace;padding:10px;z-index:99999;display:none;
  }
</style>
</head>
<body>
  <div class="bg-fallback"></div>
  <div class="sun-rays"></div>
  <div class="sun"></div>
  <canvas id="rainCanvas"></canvas>
  <div class="lightning"></div>
  <div class="vignette"></div>
  <div class="grain"></div>

  <div class="lbar top"></div>
  <div class="lbar bot"></div>

  <div class="credit" aria-hidden="true">
    <div class="c-line"><span>image</span><span>背景画像元『gogh』</span></div>
    <div class="c-line"><span>work</span><span>作品元『天気の子』</span></div>
  </div>

  <!-- question screen -->
  <div class="screen screen-q" id="screenQ">
    <div class="q-overline">— forecast —</div>
    <div class="q-title">明 日 の 天 気 は ？</div>
    <div class="q-sub">tomorrow's weather</div>
    <div class="choices">
      <button class="choice" data-answer="sunny" type="button">
        <div class="choice-name">晴 れ</div>
        <div class="choice-sub">— 赤 猫 が 多 か っ た —</div>
      </button>
      <button class="choice" data-answer="rainy" type="button">
        <div class="choice-name">雨</div>
        <div class="choice-sub">— 青 猫 が 多 か っ た —</div>
      </button>
    </div>
  </div>

  <!-- result screen -->
  <div class="screen screen-r" id="screenR">
    <div class="r-headline" id="rHeadline"></div>
    <div class="r-message" id="rMessage"></div>
    <div class="r-title-block" id="rTitleBlock">
      <div class="r-title-overline">— 称 号 —</div>
      <div class="r-title-name" id="rTitleName"></div>
    </div>
    <button class="retry-btn" id="retryBtn" type="button">も　う　一　度</button>
  </div>

  <div class="boot-err" id="bootErr"></div>

<script>
"use strict";
(function(){
  try{
    const $ = id => document.getElementById(id);

    // =======================================================
    // rain canvas — same 3-layer atmospheric rain as the event site
    // =======================================================
    const canvas = $('rainCanvas');
    const ctx = canvas.getContext('2d');
    let W = 0, H = 0, dpr = 1, drops = [];
    let intensity = 1;   // 1 = normal, 1.8 = heavier rain (used after wrong answer)

    const LAYERS = [
      { share:.30, sMin:9,  sMax:15, lMin:5,  lMax:13, oMin:.05, oMax:.12, wMin:.5, wMax:.7,  slMin:-.4, slMax:-.9 },
      { share:.40, sMin:20, sMax:34, lMin:14, lMax:30, oMin:.10, oMax:.22, wMin:.6, wMax:.9,  slMin:-.7, slMax:-1.4 },
      { share:.30, sMin:42, sMax:80, lMin:30, lMax:70, oMin:.22, oMax:.40, wMin:.9, wMax:1.3, slMin:-1.0, slMax:-2.0 }
    ];
    function rand(a,b){ return a + Math.random()*(b-a); }
    function makeDrop(L){
      return {
        x: Math.random()*W,
        y: Math.random()*H - H,
        len: rand(L.lMin, L.lMax),
        speed: rand(L.sMin, L.sMax),
        opacity: rand(L.oMin, L.oMax),
        width: rand(L.wMin, L.wMax),
        slant: rand(L.slMin, L.slMax),
        layer: L
      };
    }
    function initDrops(){
      drops = [];
      const baseCount = Math.min(Math.floor(420 * intensity), Math.max(140, Math.floor(W*H/5400 * intensity)));
      LAYERS.forEach(L => {
        const n = Math.floor(baseCount * L.share);
        for(let i = 0; i < n; i++) drops.push(makeDrop(L));
      });
    }
    function resize(){
      dpr = Math.min(2, window.devicePixelRatio || 1);
      W = innerWidth; H = innerHeight;
      canvas.width  = W * dpr;
      canvas.height = H * dpr;
      canvas.style.width  = W + 'px';
      canvas.style.height = H + 'px';
      ctx.setTransform(1,0,0,1,0,0);
      ctx.scale(dpr, dpr);
      initDrops();
    }
    function tick(){
      ctx.clearRect(0, 0, W, H);
      ctx.lineCap = 'round';
      for(let i = 0; i < drops.length; i++){
        const d = drops[i];
        ctx.lineWidth = d.width;
        const x2 = d.x + d.slant, y2 = d.y + d.len;
        const g = ctx.createLinearGradient(d.x, d.y, x2, y2);
        g.addColorStop(0, 'rgba(225,238,255,0)');
        g.addColorStop(1, 'rgba(230,240,255,' + d.opacity + ')');
        ctx.strokeStyle = g;
        ctx.beginPath();
        ctx.moveTo(d.x, d.y);
        ctx.lineTo(x2, y2);
        ctx.stroke();
        d.x += d.slant * .35;
        d.y += d.speed;
        if(d.y > H){
          d.y = -d.len - rand(0, 100);
          d.x = Math.random() * W;
          d.len     = rand(d.layer.lMin, d.layer.lMax);
          d.speed   = rand(d.layer.sMin, d.layer.sMax);
          d.opacity = rand(d.layer.oMin, d.layer.oMax);
          d.slant   = rand(d.layer.slMin, d.layer.slMax);
        }
      }
      requestAnimationFrame(tick);
    }

    let resizeT = null;
    window.addEventListener('resize', () => {
      clearTimeout(resizeT);
      resizeT = setTimeout(resize, 120);
    });
    resize();
    requestAnimationFrame(tick);

    // =======================================================
    // boot in: bars drop, question screen reveals
    // =======================================================
    setTimeout(() => document.body.classList.add('loaded'), 80);
    setTimeout(() => $('screenQ').classList.add('in'), 700);

    // =======================================================
    // choice handler
    // =======================================================
    let answered = false;
    document.querySelectorAll('.choice').forEach(btn => {
      btn.addEventListener('click', () => {
        if(answered) return;
        answered = true;
        const ans = btn.dataset.answer;
        const others = Array.from(document.querySelectorAll('.choice')).filter(c => c !== btn);
        btn.classList.add('firing');
        others.forEach(o => o.classList.add('dimmed'));
        // disable all
        document.querySelectorAll('.choice').forEach(c => { c.disabled = true; });
        // small pause so the click feels deliberate, then transition
        setTimeout(() => handleAnswer(ans), 700);
      });
    });

    function handleAnswer(ans){
      // fade question screen out
      $('screenQ').classList.remove('in');

      if(ans === 'sunny'){
        // ========== CORRECT ==========
        // start the sky brightening + rain fading immediately (CSS handles 5s transition)
        document.body.classList.add('sunny');
        // populate result text
        $('rHeadline').textContent = '大　正　解　！　！';
        $('rHeadline').classList.add('win');
        $('rMessage').textContent = '';        // no consolation message on win
        $('rTitleName').textContent = '晴 れ 男 ・ 女 ！ ！';
        $('rTitleName').classList.add('win');
      } else {
        // ========== WRONG ==========
        // intensify rain immediately
        document.body.classList.add('rainy');
        intensity = 1.8;
        initDrops();
        // populate result text
        $('rHeadline').textContent = 'ざ　ん　ね　ん';
        $('rHeadline').classList.add('lose');
        $('rMessage').textContent = '明 日 は 晴 れ で し た';
        $('rTitleName').textContent = '雨 女 ・ 男 か も し れ ま せ ん';
        $('rTitleName').classList.add('lose');
      }

      // reveal the result screen with staggered timing
      const screen = $('screenR');
      setTimeout(() => screen.classList.add('in'), 1100);
      setTimeout(() => $('rHeadline').classList.add('show'), 1700);
      if($('rMessage').textContent){
        setTimeout(() => $('rMessage').classList.add('show'), 2900);
      }
      setTimeout(() => $('rTitleBlock').classList.add('show'), ans === 'sunny' ? 3000 : 3700);
      setTimeout(() => $('retryBtn').classList.add('show'), ans === 'sunny' ? 4200 : 4900);
    }

    // retry — full reload (cheap & reliable; resets all state, classes, timers)
    $('retryBtn').addEventListener('click', () => {
      $('retryBtn').classList.remove('show');
      setTimeout(() => location.reload(), 250);
    });

  }catch(err){
    const el = document.getElementById('bootErr');
    if(el){ el.style.display = 'block'; el.textContent = 'BOOT ERROR: ' + err.message; }
    console.error(err);
  }
})();
</script>
</body>
</html>
